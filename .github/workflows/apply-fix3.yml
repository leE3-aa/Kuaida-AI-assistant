name: Apply error detail fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore pristine ProviderErrors
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/nils0000shiyong/Kuaida-AI-assistant/main/core/data/src/main/java/com/kuaida/core/data/provider/ProviderErrors.kt -o core/data/src/main/java/com/kuaida/core/data/provider/ProviderErrors.kt

      - name: Apply patch
        run: |
          set -e
          python3 tools/fix_e.py
          grep -c serverDetailSuffix core/data/src/main/java/com/kuaida/core/data/provider/ProviderErrors.kt

      - name: Commit patched source
        run: |
          git config user.name "openminis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: 错误提示带出服务端原始信息 [skip ci]"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/kuaida-debug.apk
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: err-${{ github.run_number }}
          name: 快答 debug build err-${{ github.run_number }}
          files: out/kuaida-debug.apk
          body: 错误提示带出服务端原始返回。
