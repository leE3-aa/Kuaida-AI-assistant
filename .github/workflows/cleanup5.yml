name: Cleanup 5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List current releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --limit 100

      - name: Delete intermediate releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release list --limit 100 --json tagName --jq ".[].tagName" > /tmp/tags.txt
          echo "--- found ---"
          cat /tmp/tags.txt
          while read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            case "$tag" in
              fast-1|aux2-1)
                echo "keep $tag"
                ;;
              *)
                gh release delete "$tag" --yes --cleanup-tag
                echo "deleted $tag"
                ;;
            esac
          done < /tmp/tags.txt
          exit 0

      - name: Remove temporary workflows
        run: |
          git config user.name "openminis-bot"
          git config user.email "bot@users.noreply.github.com"
          for w in cleanup4.yml cleanup5.yml; do
            if [ -f ".github/workflows/$w" ]; then
              git rm -f ".github/workflows/$w"
            fi
          done
          git commit -m "chore: 清理临时 workflow [skip ci]" || true
          git push
