name: Init fixed signing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate fixed keystore
        run: |
          set -e
          rm -f release.keystore
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias kuaida \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass kuaida2026 -keypass kuaida2026 \
            -dname "CN=Kuaida, OU=Personal, O=Kuaida, L=NA, ST=NA, C=CN"
          ls -la release.keystore

      - name: Delete obsolete releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          for tag in build-1 build-11 build-12 build-13 build-14 build-15 build-16 build-17 models-1 err-1; do
            rid=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/tags/$tag" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
            if [ -n "$rid" ]; then
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/releases/$rid"
              echo "deleted release $tag"
            fi
            git push origin --delete "$tag" || true
          done

      - name: Commit keystore
        run: |
          set -e
          git config user.name "openminis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f release.keystore
          git diff --cached --quiet || git commit -m "chore: 添加固定签名密钥 [skip ci]"
          git push
