name: Apply model picker feature

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore pristine upstream sources
        run: |
          set -e
          U=https://raw.githubusercontent.com/nils0000shiyong/Kuaida-AI-assistant/main
          for f in \
            core/model/src/main/java/com/kuaida/core/model/AppModels.kt \
            core/common/src/main/java/com/kuaida/core/common/ui/UiLabels.kt \
            core/data/src/main/java/com/kuaida/core/data/datastore/UserPreferencesDataSource.kt \
            core/data/src/main/java/com/kuaida/core/data/provider/ModelCatalog.kt \
            core/data/src/main/java/com/kuaida/core/data/provider/OpenAiCompatibleProviders.kt \
            core/data/src/main/java/com/kuaida/core/data/provider/ProviderErrors.kt \
            core/data/src/main/java/com/kuaida/core/data/di/DataModule.kt \
            core/data/src/main/java/com/kuaida/core/data/repository/SettingsRepository.kt \
            feature/settings/src/main/java/com/kuaida/feature/settings/SettingsViewModel.kt \
            feature/settings/src/main/java/com/kuaida/feature/settings/SettingsScreen.kt ; do
            curl -fsSL "$U/$f" -o "$f"
          done

      - name: Apply patches
        run: |
          set -e
          for s in a b c1 c2 d1 d2 e f g1 g2 h i j k l m n o p q r s t u v w ; do
            echo "--- fix_$s"
            python3 tools/fix_$s.py
          done
          grep -c fetchAuxModels feature/settings/src/main/java/com/kuaida/feature/settings/SettingsViewModel.kt
          grep -c showRefresh feature/settings/src/main/java/com/kuaida/feature/settings/SettingsScreen.kt

      - name: Commit patched sources
        run: |
          git config user.name "openminis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: 向量/语音模型支持拉取选择；删除内置模型选项 [skip ci]"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/kuaida-debug.apk
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pick-${{ github.run_number }}
          name: 快答 debug build pick-${{ github.run_number }}
          files: out/kuaida-debug.apk
          body: 向量/语音模型支持从接口拉取并选择；删除内置的三个模型选项；修复保存提示与掩码刷新。
