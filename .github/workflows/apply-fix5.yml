name: Apply thinking timeout fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore pristine upstream sources
        run: |
          set -e
          U=https://raw.githubusercontent.com/nils0000shiyong/Kuaida-AI-assistant/main
          curl -fsSL $U/core/data/src/main/java/com/kuaida/core/data/provider/OpenAiCompatibleProviders.kt -o core/data/src/main/java/com/kuaida/core/data/provider/OpenAiCompatibleProviders.kt
          curl -fsSL $U/core/data/src/main/java/com/kuaida/core/data/di/DataModule.kt -o core/data/src/main/java/com/kuaida/core/data/di/DataModule.kt

      - name: Apply patches
        run: |
          set -e
          python3 tools/fix_a.py
          python3 tools/fix_h.py
          python3 tools/fix_i.py
          grep -c ThinkingOption core/data/src/main/java/com/kuaida/core/data/provider/OpenAiCompatibleProviders.kt
          grep -c readTimeout core/data/src/main/java/com/kuaida/core/data/di/DataModule.kt

      - name: Commit patched sources
        run: |
          git config user.name "openminis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: 关闭深度思考并放宽读取超时 [skip ci]"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/kuaida-debug.apk
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: fast-${{ github.run_number }}
          name: 快答 debug build fast-${{ github.run_number }}
          files: out/kuaida-debug.apk
          body: 关闭深度思考模式、读取超时放宽到 20 秒。
